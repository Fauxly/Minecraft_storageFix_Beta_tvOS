#!/bin/bash
set -euo pipefail

rm -rf build
mkdir -p build

echo "🚀 Build Started (tvOS)"
echo

# 🔍 ищем проект автоматически
PROJECT=$(find . -name "*.xcodeproj" | head -n 1)

if [ -z "$PROJECT" ]; then
  echo "❌ .xcodeproj NOT FOUND"
  exit 1
fi

echo "✅ Found project: $PROJECT"

# 🔍 ищем схему
SCHEME=$(xcodebuild -list -project "$PROJECT" | grep -A 20 "Schemes:" | tail -n +2 | head -n 1 | xargs)

echo "✅ Using scheme: $SCHEME"

# билд под tvOS
xcodebuild \
  -project "$PROJECT" \
  -scheme "$SCHEME" \
  -configuration Debug \
  -sdk appletvos \
  -destination "generic/platform=tvOS" \
  CODE_SIGNING_ALLOWED=NO \
  CODE_SIGNING_REQUIRED=NO \
  build | tee build/xcodebuild.log

# ищем .app
APP_PATH=$(find "$PWD" -name "*.app" -type d | grep appletvos | head -n 1)

if [ -z "$APP_PATH" ]; then
  echo "❌ .app NOT FOUND"
  exit 1
fi

echo "✅ Found app: $APP_PATH"

# создаём IPA
rm -rf build/Payload
mkdir -p build/Payload
cp -R "$APP_PATH" build/Payload/

# plist фикс (если есть)
plutil -replace UIFileSharingEnabled -bool YES build/Payload/*.app/Info.plist || true

# проверка ldid
if ! command -v ldid >/dev/null 2>&1; then
  echo "❌ ldid not installed"
  exit 1
fi

# подпись (tvOS тоже ок)
APP_BIN=$(find build/Payload -name "*" -type f -perm +111 | head -n 1)
ldid -SConfig/lara.entitlements "$APP_BIN" || true

# упаковка
cd build
zip -qry lara.ipa Payload

echo
echo "✅ BUILD SUCCESS (tvOS)"
echo "📦 IPA: build/lara.ipa"
